# Publishes the package to hex when a GitHub Release is published (or a prerelease is promoted).
# The release tag must be the bare mix.exs @version (X.Y.Z) on a commit that is on main;
# prereleases are skipped until promoted to a release. Needs the repository secret HEX_API_KEY.
name: Release to hex

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches the mix.exs version
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match mix.exs @version '$version' (tags are bare X.Y.Z)"
            exit 1
          fi

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag '$RELEASE_TAG' ($GITHUB_SHA) is not on origin/main"
            exit 1
          fi

      - name: Determine the elixir version
        run: echo "ELIXIR_VERSION=$(grep -h elixir .tool-versions | awk '{ print $2 }' | awk -F - '{print $1}')" >> "$GITHUB_ENV"

      - name: Determine the otp version
        run: echo "OTP_VERSION=$(grep -h erlang .tool-versions | awk '{ print $2 }')" >> "$GITHUB_ENV"

      - name: Setup Elixir and Erlang versions
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore the deps cache
        uses: actions/cache@v6
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-deps-mixlockhash-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-deps-

      - name: Restore the _build cache
        uses: actions/cache@v6
        id: build-cache
        with:
          path: _build
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-build-mixlockhash-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-build-

      - name: Fetch mix dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Full bless
        run: |
          epmd -daemon
          mix bless

      - name: Publish to hex
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
